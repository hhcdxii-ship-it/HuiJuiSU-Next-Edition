name: HuiJuiSU Ultimate Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# 不需要写权限了，因为咱们不自动发 Release
permissions:
  contents: read

env:
  APP_VERSION: "vNext-1.0.${{ github.run_number }}"

jobs:
  # ==========================================
  # 0-3 段：核心 C 工具编译 (Hsud + huijui_boot)
  # ==========================================
  build-c-tools:
    name: Compile C Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK (Cached)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Compile Hsud Daemon
        run: |
          echo ">>> 编译 Hsud.c ..."
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang \
            -O2 -static -s -o Hsud Hsud.c
          file Hsud

      - name: Compile huijui_boot Tool
        run: |
          echo ">>> 编译 huijui_boot.c ..."
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang \
            -O2 -static -s -o huijui_boot boot_tool/huijui_boot.c
          file huijui_boot

      - name: Upload C Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-Tools
          path: |
            Hsud
            huijui_boot
          retention-days: 1

  # ==========================================
  # 4-6 段：HUI 内核模块 16 核矩阵编译
  # ==========================================
  build-hui-core:
    name: Build HUI Core (${{ matrix.gki_branch }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build-c-tools
    strategy:
      fail-fast: false
      matrix:
        gki_branch: [
          "android12-5.10", "android13-5.10", "android13-5.15",
          "android14-5.15", "android14-6.1", "android15-6.6",
          "android16-6.12", "android17-6.18"
        ]
        arch: ["arm64"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc zip git curl clang lld llvm gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu libdwarf-dev libdw-dev

      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: gki-kernel
          key: kernel-${{ matrix.gki_branch }}-${{ hashFiles('.github/workflows/build-manager.yml') }}

      - name: Download Kernel Source (If not cached)
        run: |
          if [ ! -d "gki-kernel" ]; then
            echo ">>> 内核源码未命中缓存，开始浅克隆..."
            git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ matrix.gki_branch }} gki-kernel
          else
            echo ">>> 命中内核源码缓存，跳过克隆！"
          fi

      - name: Build HUI Core
        run: |
          cd gki-kernel
          export ARCH=${{ matrix.arch }}
          export LLVM=1
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export CROSS_COMPILE=x86_64-linux-gnu-
          fi
          make ARCH=${{ matrix.arch }} LLVM=1 gki_defconfig
          if [[ "${{ matrix.gki_branch }}" == "android15-6.6" || "${{ matrix.gki_branch }}" == "android16-6.12" || "${{ matrix.gki_branch }}" == "android17-6.18" ]]; then
            ./scripts/config --file .config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE
          fi
          make ARCH=${{ matrix.arch }} LLVM=1 modules_prepare
          make ARCH=${{ matrix.arch }} LLVM=1 M=${{ github.workspace }}/kernel KBUILD_MODPOST_WARN=1 modules
          mkdir -p ${{ github.workspace }}/lkm_out
          cp ${{ github.workspace }}/kernel/HUI.ko ${{ github.workspace }}/lkm_out/HUI_${{ matrix.gki_branch }}_${{ matrix.arch }}.ko

      - name: Upload HUI HUI
        uses: actions/upload-artifact@v4
        with:
          name: HUI-${{ matrix.gki_branch }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/lkm_out/*.ko
          retention-days: 1

  # ==========================================
  # 7-9 段：产物聚合、App 编译 (使用你的正式签名)
  # ==========================================
  build-and-package:
    name: Package APKs
    runs-on: ubuntu-latest
    needs: [build-c-tools, build-hui-core]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download C Tools
        uses: actions/download-artifact@v4
        with:
          name: C-Tools
          path: app/src/main/assets/

      - name: Download All HUI HUIs
        uses: actions/download-artifact@v4
        with:
          pattern: HUI-*
          merge-multiple: true
          path: app/src/main/assets/lkm/

      - name: Verify Assets
        run: |
          echo ">>> 当前 Assets 目录结构:"
          ls -la app/src/main/assets/
          echo ">>> HUI 矩阵数量 (应该为 16):"
          ls -1 app/src/main/assets/lkm/ | wc -l

      - name: Inject Version Name
        run: |
          # 使用 GitHub Run Number 保证每次版本都在递增
          sed -i 's/versionName = ".*"/versionName = "${{ env.APP_VERSION }}"/g' app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts
          cat app/build.gradle.kts | grep -E "versionCode|versionName"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 🚀 核心改动：解码你在 Secrets 中配置的专属 Keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > huijui_release.jks
            echo "✅ Keystore 解码成功！"
          else
            echo "⚠️ 未配置签名密钥，Release 包将无法签名！"
          fi

      # 编译 Debug 和 Signed Release 包
      - name: Build APKs
        env:
          KEYSTORE_FILE: "huijui_release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      # 上传 Debug 产物供下载
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HuiJuiSU-Next-Edition-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 上传 Release 产物供下载
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HuiJuiSU-Next-Edition-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf gki-kernel
          rm -f huijui_resease.jks huijui_release.jks
          echo "✅ 构建空间已清理，防止爆盘！"

      - name: Summary
        if: always()
        run: |
          echo "### 🚀 HuiJuiSU Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: ${{ env.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **构建状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **产物**: 请点击上方的 Artifacts 下载。" >> $GITHUB_STEP_SUMMARY
