name: Build Next Edition (App + Multi-Version LKM)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 🚀 修复 1：赋予 Token 写入 Release 的权限
permissions:
  contents: write

jobs:
  # 1. 编译 App
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build App with Gradle
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HuiJuiSU-App
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HuiJuiSU Next Edition (Build ${{ github.run_number }})
          body: "纯血架构自动化构建，自动发布 APK。"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. 矩阵编译多版本纯血 LKM
  build-lkm:
    name: Build LKM (${{ matrix.gki_branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gki_branch:
          - "android12-5.10"
          - "android13-5.10"
          - "android13-5.15"
          - "android14-5.15"
          - "android14-6.1"
          - "android15-6.6"
          - "android16-6.12"
          - "android17-6.18"
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc zip git curl clang lld llvm

      - name: Download AOSP Kernel Source (${{ matrix.gki_branch }})
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ matrix.gki_branch }} gki-kernel

      - name: Build Pure-Blood LKM
        run: |
          cd gki-kernel
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          
          # 初始化配置
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 🚀 修复 2：生成编译外部模块所需的头文件 (解决 asm/types.h 缺失)
          make ARCH=arm64 LLVM=1 modules_prepare
          
          # 编译 LKM
          make ARCH=arm64 LLVM=1 M=${{ github.workspace }}/kernel modules
