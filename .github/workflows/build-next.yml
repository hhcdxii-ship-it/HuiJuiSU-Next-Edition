name: Build Next Edition (Full Stack)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. 编译 App (纯血 UI)
  # ==========================================
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build App with Gradle
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HuiJuiSU-App
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HuiJuiSU Next Edition (Build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 2. 编译 LKM (16 个全架构版本)
  # ==========================================
  build-lkm:
    name: Build LKM (${{ matrix.gki_branch }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gki_branch:
          - "android12-5.10"
          - "android13-5.10"
          - "android13-5.15"
          - "android14-5.15"
          - "android14-6.1"
          - "android15-6.6"
          - "android16-6.12"
          - "android17-6.18"
        arch:
          - "arm64"
          - "x86_64"
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc zip git curl clang lld llvm

      - name: Download AOSP Kernel Source (${{ matrix.gki_branch }})
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ matrix.gki_branch }} gki-kernel

      - name: Build Pure-Blood LKM
        run: |
          cd gki-kernel
          export ARCH=${{ matrix.arch }}
          export LLVM=1
          
          # 🚀 修复老内核（12-5.10）的汇编器报错
          if [ "${{ matrix.gki_branch }}" == "android12-5.10" ]; then
              export KCFLAGS="-mno-outline-atomics"
          fi
          
          make ARCH=${{ matrix.arch }} LLVM=1 gki_defconfig
          
          # 🚀 修复新内核（15+）的全量 LTO 内存溢出报错
          if [ "${{ matrix.gki_branch }}" != "android12-5.10" ]; then
              ./scripts/config --file .config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          fi
          
          make ARCH=${{ matrix.arch }} LLVM=1 modules_prepare
          make ARCH=${{ matrix.arch }} LLVM=1 M=${{ github.workspace }}/kernel modules

      - name: Upload LKM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKM-${{ matrix.gki_branch }}-${{ matrix.arch }}
          path: gki-kernel/kernel/huijui_lkm.ko
