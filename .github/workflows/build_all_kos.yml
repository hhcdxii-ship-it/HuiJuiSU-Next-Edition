name: Build and Release HUI Modules

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# 🚀 强制管控并发，同一个时间只准跑一个流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 🚀 核心护身符：哪怕 A12 报错，其他的 A13-A17 也会继续跑到底！
      fail-fast: false 
      matrix:
        branch: ["android12-5.10", "android13-5.10", "android13-5.15", "android14-5.15", "android14-6.1", "android15-6.6", "android16-6.12", "android17-6.18"]
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y repo git build-essential bc bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      
    - name: Fetch Kernel Source
      run: |
        git clone https://android.googlesource.com/kernel/common -b ${{ matrix.branch }} --depth=1 common
        cd common
        make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
        make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
        
    - name: Compile KO
      run: |
        cd kernel/src
        rm -f *.o *.ko *.mod* .*.cmd
        make -C ../../common M=$PWD ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- KBUILD_EXTRA_SYMBOLS=../../common/vmlinux.symvers modules
        llvm-strip --strip-debug temp_root.ko || aarch64-linux-gnu-strip --strip-debug temp_root.ko
        mv temp_root.ko HuiJuiPhantom_${{ matrix.branch }}_arm64.ko
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HUI_KO_${{ matrix.branch }}
        path: kernel/src/HuiJuiPhantom_${{ matrix.branch }}_arm64.ko

  release:
    needs: build
    runs-on: ubuntu-latest
    # 就算前面有某个版本失败了，只要出了包，这个发布步骤也要执行
    if: always() 
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0-build
        name: "HUI 全版本内核模块"
        body: "基于最新源码编译的全版本纯净版 .ko"
        files: artifacts/*.ko
