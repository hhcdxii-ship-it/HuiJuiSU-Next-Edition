name: Build and Release HUI Modules

on:
  workflow_dispatch:
  push:
    branches: [ "main", "polish/v3" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.10 / 5.15 的 GKI 只认 clang 12~14 那一代。
          # 用 runner 自带的 clang 18 会在 arch/arm64/kernel/asm-offsets.s 阶段炸：
          #   error: register 'sp' unsuitable for global register variables
          #   error: value '1025' out of range for constraint 'I'
          - branch: android12-5.10
            tools: "CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 STRIP=llvm-strip-14 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          - branch: android13-5.10
            tools: "CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 STRIP=llvm-strip-14 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          - branch: android13-5.15
            tools: "CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 STRIP=llvm-strip-14 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          - branch: android14-5.15
            tools: "CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 STRIP=llvm-strip-14 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          - branch: android14-6.1
            tools: "LLVM=1"
          - branch: android15-6.6
            tools: "LLVM=1"
          - branch: android16-6.12
            tools: "LLVM=1"
          - branch: android17-6.18
            tools: "LLVM=1"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # dwarves 提供 pahole —— 没有它 vmlinux 会在 BTF 阶段失败：
          #   "BTF: .tmp_vmlinux.btf: pahole (pahole) is not available"
          sudo apt-get install -y repo git build-essential bc bison flex \
            libssl-dev libelf-dev libdw-dev dwarves clang lld llvm \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # GitHub 标准 runner 的根分区只有 ~14GB，而 GKI 全量编 vmlinux 需要 30GB+。
      # 这一步能腾出 15-20GB —— 之前 Build vmlinux 失败极可能是磁盘写满。
      - name: Free disk space
        run: |
          echo "--- 清理前 ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          echo "--- 清理后 ---"; df -h /

      - name: Toolchain info
        run: |
          clang --version | head -2 || true
          ld.lld --version || true
          aarch64-linux-gnu-gcc --version | head -1 || true
          nproc

      - name: Fetch Kernel Source
        run: |
          git clone https://android.googlesource.com/kernel/common \
            -b ${{ matrix.branch }} --depth=1 common

      - name: Configure Kernel
        working-directory: common
        run: |
          make ARCH=arm64 ${{ matrix.tools }} gki_defconfig

      # ⚠️ 关键步骤，之前缺失：
      #    modules_prepare 只生成头文件和脚本，**不生成 Module.symvers**。
      #    没有 vmlinux.symvers，modpost 无法解析导出符号的 CRC，
      #    编译出来的 .ko 里 __versions 全为 0x00000000，
      #    insmod 时会报 "disagrees about version of symbol module_layout" 并失败。
      #    必须完整编一次 vmlinux 才会产出 Module.symvers。
      - name: Build vmlinux (generates Module.symvers)
        working-directory: common
        run: |
          # 不要把输出直接喂给 tail —— make 的报错往往出现在成千上万行
          # HDRINST/CC 之前，被 tail 截掉后就只剩"exit code 2"没法定位。
          # 这里写全量日志，失败时只挑错误行和最后几十行打印。
          if ! make ARCH=arm64 ${{ matrix.tools }} -j$(nproc) vmlinux > build_vmlinux.log 2>&1; then
            echo "===== 错误行 ====="
            grep -nE 'error:|Error [0-9]|\*\*\*|not available|No such file' build_vmlinux.log | tail -40 || true
            echo "===== 最后 40 行 ====="
            tail -40 build_vmlinux.log
            echo "===== 资源 ====="
            df -h / || true
            free -h || true
            exit 1
          fi
          echo "vmlinux 构建完成，输出行数: $(wc -l < build_vmlinux.log)"

          ls -l Module.symvers vmlinux.symvers 2>/dev/null || true
          if [ ! -s Module.symvers ] && [ -s vmlinux.symvers ]; then
            cp vmlinux.symvers Module.symvers
            echo "已把 vmlinux.symvers 复制为 Module.symvers"
          fi

      # 生成 scripts/module.lds、include/generated 等外部模块必需的基础设施。
      # 只编 vmlinux 不会产出 scripts/module.lds，模块链接时会报
      # "No rule to make target 'scripts/module.lds'"。
      - name: Prepare module infrastructure
        working-directory: common
        run: |
          make ARCH=arm64 ${{ matrix.tools }} modules_prepare > prepare.log 2>&1 || {
            echo "===== modules_prepare 失败 ====="
            grep -nE 'error:|Error [0-9]|\*\*\*' prepare.log | tail -20 || true
            tail -20 prepare.log
            exit 1
          }
          test -f scripts/module.lds && echo "scripts/module.lds OK"
          test -s Module.symvers || {
            echo "::error::没有 Module.symvers"
            exit 1
          }
          echo "Module.symvers 行数: $(wc -l < Module.symvers)"

      - name: Compile KO
        working-directory: kernel/src
        run: |
          # 彻底清掉上次/仓库里残留的 kbuild 中间产物。
          # 只删 *.o *.ko 不够：modules.order、.modules.order.cmd、Module.symvers
          # 残留会让 modfinal 报 "No rule to make target temp_root.ko"。
          make -C ../../common M="$PWD" clean >/dev/null 2>&1 || true
          rm -f *.o *.ko *.mod *.mod.c *.symvers .*.cmd
          rm -f modules.order .modules.order.cmd .module-common.o
          # KBUILD_MODPOST_WARN=1：GKI 会裁剪未使用的导出符号，我们模块里可能有
          # 少量符号在新分支上已不再导出。硬失败会导致整轮拿不到产物；
          # 这里保留警告，真正的 CRC 由上一步的 Module.symvers 保证。
          make -C ../../common M="$PWD" ARCH=arm64 ${{ matrix.tools }} \
               KBUILD_MODPOST_WARN=1 modules 2>&1 | tail -80

          llvm-strip --strip-debug huijui_phantom.ko temp_root.ko \
            || aarch64-linux-gnu-strip --strip-debug huijui_phantom.ko temp_root.ko

          mv huijui_phantom.ko "HuiJuiPhantom_${{ matrix.branch }}_arm64.ko"

      - name: Verify Module
        working-directory: kernel/src
        run: |
          KO="HuiJuiPhantom_${{ matrix.branch }}_arm64.ko"
          test -f "$KO" || { echo "::error::未产出 $KO"; exit 1; }
          SIZE=$(stat -c %s "$KO")
          echo "大小: $SIZE B"
          [ "$SIZE" -gt 8000 ] || { echo "::error::文件过小，疑似空模块"; exit 1; }

          # ELF 头必须是 AArch64
          file "$KO" | grep -q 'ARM aarch64' || { echo "::error::不是 AArch64 ELF"; exit 1; }

          # vermagic 必须和本 KMI 分支的内核版本主线一致
          echo "--- vermagic ---"
          strings "$KO" | grep -m1 'vermagic=' || { echo "::error::缺少 vermagic"; exit 1; }
          EXPECT=$(echo "${{ matrix.branch }}" | sed -E 's/.*-([0-9]+\.[0-9]+)$/\1/')
          strings "$KO" | grep -m1 'vermagic=' | grep -q "^vermagic=$EXPECT" \
            || { echo "::error::vermagic 与分支 ${{ matrix.branch }} 不符"; exit 1; }

          # __versions 必须存在且有内容 —— 空的说明没拿到 Module.symvers，
          # 这种模块在开了 CONFIG_MODVERSIONS 的 GKI 内核上根本 insmod 不进去。
          if ! readelf -S "$KO" | grep -q '__versions'; then
            echo "::error::$KO 没有 __versions 段（CRC 缺失，无法加载）"; exit 1
          fi
          BYTES=$(readelf -x __versions "$KO" | grep -c '0x' || true)
          echo "__versions 十六进制行数: $BYTES"
          [ "$BYTES" -gt 2 ] || { echo "::error::$KO 的 __versions 为空"; exit 1; }

          echo "✅ 校验通过: $KO"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUI_KO_${{ matrix.branch }}
          path: kernel/src/HuiJuiPhantom_${{ matrix.branch }}_arm64.ko
          if-no-files-found: error

  # 把编译产物直接回写进 App 的 assets，这样打完就是最新的 8 个 ko
  sync-assets:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: kos
          merge-multiple: true

      - name: Copy into app assets
        run: |
          cp -v kos/*.ko app/src/main/assets/exploit/
          ls -l app/src/main/assets/exploit/*.ko

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/exploit/*.ko
          if git diff --cached --quiet; then
            echo "内核模块无变化，跳过提交"
          else
            git commit -m "chore(kernel): 云编译更新 8 个 KMI 内核模块 [skip ci]"
            git push
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ko-latest
          name: "HUI 全版本内核模块（最新）"
          body: |
            基于最新源码编译的全 KMI 内核模块。

            | KMI | 说明 |
             |---|---|
             | android12-5.10 | Android 12 / 5.10 |
             | android13-5.10 | Android 13 / 5.10 |
             | android13-5.15 | Android 13 / 5.15 |
             | android14-5.15 | Android 14 / 5.15 |
             | android14-6.1  | Android 14 / 6.1  |
             | android15-6.6  | Android 15 / 6.6  |
             | android16-6.12 | Android 16 / 6.12 |
             | android17-6.18 | Android 17 / 6.18 |
          files: artifacts/*.ko
          make_latest: false
