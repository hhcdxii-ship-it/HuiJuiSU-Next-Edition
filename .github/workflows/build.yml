name: HuiJui Phantom CI/CD (Pure Pack)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    # 验证一下本地的 8 个 ko 是否都推上来了
    - name: Verify Local KOs
      run: |
        echo "📦 检查 assets/exploit 目录下的内核模块："
        ls -lh app/src/main/assets/exploit/

    - name: Build Signed APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Package Final ZIP
      run: |
        mkdir -p final_package
        cp app/build/outputs/apk/release/*.apk final_package/HuiJuiSU-Full-Universal.apk
        # 打包时把 8 个内核也一起塞进去
        cp app/src/main/assets/exploit/*.ko final_package/
        echo "Build Date: $(date)" > final_package/build-info.txt
        zip -r HuiJuiSU-Full-Release.zip final_package/

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Full Package (APK + All KOs)
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Full-Package
        path: HuiJuiSU-Full-Release.zip
