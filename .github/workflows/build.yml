name: HuiJui Phantom CI/CD (Pure Pack)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🚀 关键新增 1：配置 Android NDK
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '26.1.10909125'

    # 🚀 关键新增 2：云端编译 C++ 引擎 (hsud & huijuiinit)
    - name: Build Native Engines (hsud & huijuiinit)
      run: |
        cd core/root/native
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
        cmake --build build -j4
        
        # 把编译好的引擎塞进 assets（覆盖本地旧文件）
        mkdir -p ../../../app/src/main/assets/exploit
        cp build/hsud ../../../app/src/main/assets/exploit/hsud
        cp build/hsud ../../../app/src/main/assets/exploit/hud
        cp build/huijuiinit ../../../app/src/main/assets/exploit/huijuiinit
        chmod 755 ../../../app/src/main/assets/exploit/hsud ../../../app/src/main/assets/exploit/hud ../../../app/src/main/assets/exploit/huijuiinit

    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    # 验证一下引擎和 KO 是否都准备好了
    - name: Verify Engines & KOs
      run: |
        echo "📦 检查 assets/exploit 目录下的所有文件："
        ls -lh app/src/main/assets/exploit/

    - name: Build Signed APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Package Final ZIP
      run: |
        mkdir -p final_package
        cp app/build/outputs/apk/release/*.apk final_package/HuiJuiSU-Full-Universal.apk
        cp app/src/main/assets/exploit/*.ko final_package/
        echo "Build Date: $(date)" > final_package/build-info.txt
        zip -r HuiJuiSU-Full-Release.zip final_package/

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Full Package (APK + All KOs)
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Full-Package
        path: HuiJuiSU-Full-Release.zip
