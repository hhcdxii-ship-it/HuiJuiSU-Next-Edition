name: HuiJui Phantom CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build and Package (APK + KOs)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Build Signed APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Package All Artifacts
      run: |
        mkdir -p final_package
        # 把编译出的 APK 放进去
        cp app/build/outputs/apk/release/*.apk final_package/ || true
        
        # 把仓库里 assets/exploit/ 下所有的 .ko（不管几个架构）全放进去
        cp -r app/src/main/assets/exploit/*.ko final_package/ || true
        
        # 生成一份构建信息
        echo "Build Date: $(date)" > final_package/build-info.txt
        echo "Commit: ${{ github.sha }}" >> final_package/build-info.txt
        
        # 打包成一个 ZIP 压缩包
        zip -r HuiJuiSU-Full-Release.zip final_package/
        ls -lh HuiJuiSU-Full-Release.zip

    - name: Upload Final APK (Standalone)
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Full ZIP Package (APK + All KOs)
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Full-Package
        path: HuiJuiSU-Full-Release.zip
