name: Build HuiJuiSU Next

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > huijui_release.jks
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      env:
        KEYSTORE_FILE: "huijui_release.jks"
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    # 🚀 上传 Debug 产物
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Next-Edition-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    # 🚀 上传 Release 产物（去掉了 Signed，直接叫 release）
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Next-Edition-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
