name: HuiJui Phantom CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ko:
    name: Build Phantom (${{ matrix.gki_version }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gki_version: [ "android12-5.10" ]
        arch: [ "arm64" ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld llvm make bc cpio flex bison libssl-dev libelf-dev ccache

    - name: Fetch GKI Headers (${{ matrix.gki_version }})
      run: |
        echo "🔄 正在下载 ${{ matrix.gki_version }} 的内核源码..."
        # 🚀 使用假地址测试流程
        wget -q https://github.com/xxxxx/gki_headers/releases/download/${{ matrix.gki_version }}/headers.tar.gz -O headers.tar.gz || echo "下载失败，请替换真实地址"
        mkdir -p ./gki_headers/${{ matrix.gki_version }}
        tar -xzf headers.tar.gz -C ./gki_headers/${{ matrix.gki_version }} || true

    - name: Build Kernel Module
      run: |
        cd kernel
        CROSS_COMPILE="aarch64-linux-gnu-"
        export CCACHE_DIR=~/.ccache
        export USE_CCACHE=1

        make ARCH=arm64 CC="ccache clang" LLVM=1 \
          CROSS_COMPILE=$CROSS_COMPILE \
          KDIR=../gki_headers/${{ matrix.gki_version }} \
          modules KBUILD_MODPOST_WARN=1
