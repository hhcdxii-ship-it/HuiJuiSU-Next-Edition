name: Build HuiJuiSU

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Compile C Daemon (Cloud Build)
      run: |
        echo ">>> 正在云端寻找 NDK..."
        # GitHub 的 Ubuntu 机器默认自带 ANDROID_HOME 和 NDK
        NDK_BASE=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
        if [ -z "$NDK_BASE" ]; then
            echo "找不到 NDK，正在下载..."
            # 如果自带的没有，我们直接下一个指定版本
            wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q android-ndk-r26d-linux.zip
            NDK_BASE="$PWD/android-ndk-r26d"
        fi
        echo " ✅ 使用 NDK: $NDK_BASE"

        CC="$NDK_BASE/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
        
        echo ">>> 编译 huijui_ksud.c ..."
        $CC -O2 -static -s -o app/src/main/assets/huijui_ksud huijui_ksud.c
        chmod +x app/src/main/assets/huijui_ksud
        
        echo ">>> 编译结果验证："
        file app/src/main/assets/huijui_ksud

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
