name: HuiJui Phantom CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ko:
    name: Build Phantom (${{ matrix.gki_version }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 先跑通一个，等下再全开
        gki_version: [ "android12-5.10" ]
        arch: [ "arm64" ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld llvm make bc cpio flex bison libssl-dev libelf-dev ccache git
        # 安装交叉编译工具链
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.gki_version }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.gki_version }}-${{ matrix.arch }}-

    - name: Fetch GKI Source (${{ matrix.gki_version }})
      run: |
        echo "🔄 正在克隆 AOSP 内核源码 (${{ matrix.gki_version }})，这可能需要几分钟..."
        # 🚀 使用 AOSP 官方源，浅克隆对应分支
        git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ matrix.gki_version }} ./gki_headers/${{ matrix.gki_version }}

    - name: Prepare Kernel Modules Build
      run: |
        cd ./gki_headers/${{ matrix.gki_version }}
        echo "⚙️ 正在配置内核编译环境 (gki_defconfig + modules_prepare)..."
        make ARCH=arm64 LLVM=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
        make ARCH=arm64 LLVM=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

    - name: Build Kernel Module
      run: |
        cd kernel
        export CCACHE_DIR=~/.ccache
        export USE_CCACHE=1
        
        echo "🚀 开始编译 HuiJuiPhantom.ko..."
        make ARCH=arm64 CC="ccache clang" LLVM=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KDIR=../gki_headers/${{ matrix.gki_version }} \
          modules KBUILD_MODPOST_WARN=1

        llvm-strip --strip-debug HuiJuiPhantom.ko
        mv HuiJuiPhantom.ko HuiJuiPhantom_${{ matrix.gki_version }}_${{ matrix.arch }}.ko

    - name: Upload .ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ko-${{ matrix.gki_version }}-${{ matrix.arch }}
        path: kernel/HuiJuiPhantom_*.ko
