name: Build HuiJuiSU Next

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    # 🚀 开启 Gradle 缓存，大幅缩短编译时间
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 如果是打 Tag（比如 v1.0.0），则顺带打 Release 包
    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/v')
      run: ./gradlew assembleRelease --stacktrace

    # 📦 自动上传 Debug 产物，哪怕代码错了也能下载下来看日志
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HuiJuiSU-Next-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    # 🎉 如果推送了 Tag，自动创建一个 GitHub Release 并带上 APK
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release-unsigned.apk
        name: HuiJuiSU Next ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
